name: Probe sources

# Manual, read-only check that every source feed and article page can be
# fetched and scraped from a GitHub runner. Does not touch state or the feed.
on:
  workflow_dispatch:
    inputs:
      per_feed:
        description: Articles to scrape per feed
        default: '2'
      config:
        description: Region config (config.yaml = Kharkiv, regions/odesa/config.yaml = Odesa)
        default: config.yaml
      extra:
        description: Extra candidate feed URLs, space-separated (not counted as failures)
        default: ''

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: pip install --disable-pip-version-check -q -r engine/requirements.txt
      - name: Probe
        working-directory: engine
        env:
          NEWSFEED_CONFIG: ${{ inputs.config }}
          PER_FEED: ${{ inputs.per_feed }}
          EXTRA: ${{ inputs.extra }}
        run: |
          curl -s https://ipinfo.io/country || true
          # shellcheck disable=SC2086
          python -m ci.probe "$PER_FEED" $EXTRA
