# Feed list for the aggregator.
# Enable or disable entries with `enabled`. Add any RSS/Atom URL.
#
# Active Kharkiv sources. List order does not affect dedup: the earliest
# publisher of a story always wins (see newsfeed/dedup.py and semantic_dedup.py).
# Google News Poland entries are kept as disabled examples.

feeds:
  - id: infocity
    url: https://infocity.kharkiv.ua/feed/
    enabled: true
    category: Харків
    name: Інфосіті

  - id: status-quo
    url: https://www.sq.com.ua/rss/ukr/novini.xml
    enabled: true
    category: Харків
    name: Status Quo

  - id: 2day
    url: https://2day.kh.ua/ua/feed
    enabled: true
    category: Харків
    name: Kharkiv Today

  - id: gwaramedia
    url: https://gwaramedia.com/feed/
    enabled: true
    category: Харків
    name: Ґвара Медіа

  - id: mykharkov
    url: https://mykharkov.info/feed
    enabled: true
    category: Харків
    name: Мій Харків

  - id: objectiv
    url: https://www.objectiv.tv/uk/feed/
    enabled: true
    category: Харків
    name: Обʼєктив

  # National Suspilne feed; only items whose title matches title_keywords.txt
  # are kept, and other regional newsrooms (/chernihiv/, /lviv/, …) are dropped.
  - id: suspilne
    url: https://suspilne.media/rss/all.rss
    enabled: true
    category: Харків
    name: Суспільне Харків

  # Use nakypilo.ua, not the stale nakipelo.ua/feed/ (stuck in May 2024).
  - id: nakypilo
    url: https://nakypilo.ua/feed/
    enabled: true
    category: Харків
    name: Накипіло

  - id: atn
    url: https://atn.ua/feed/
    enabled: true
    category: Харків
    name: АТН

  # --- Disabled examples (Google News Poland) ---
  # Swap enabled flags (and region in config.yaml) to use these instead.
  - id: gn-pl-top
    url: https://news.google.com/rss?hl=pl&gl=PL&ceid=PL:pl
    enabled: false
    category: TOP
    name: Google News PL — Najważniejsze

  - id: gn-pl-world
    url: https://news.google.com/rss/headlines/section/topic/WORLD?hl=pl&gl=PL&ceid=PL:pl
    enabled: false
    category: WORLD
    name: Google News PL — Świat

  - id: gn-pl-nation
    url: https://news.google.com/rss/headlines/section/topic/NATION?hl=pl&gl=PL&ceid=PL:pl
    enabled: false
    category: NATION
    name: Google News PL — Kraj
